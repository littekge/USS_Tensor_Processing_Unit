[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nn-assembler"
version = "0.1.0"
description = "Neural Network Assembler — lowers StableHLO + weights into a Functional TPU transmission."
readme = "main.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy"]

[project.scripts]
nn-assemble = "nn_assembler.Convert:main"

# The source lives in src/ but is imported as the `nn_assembler` package. The
# directory keeps the name `src/` to match the layout documented in main.md.
[tool.setuptools]
packages = ["nn_assembler", "nn_assembler.MLIR"]

[tool.setuptools.package-dir]
nn_assembler = "src"
